# Render Blueprint — see docs/deployment.md for the full first-deploy runbook (role password
# rotation, template seeding, and the other manual steps a blueprint can't automate).
#
# Render, not Vercel: this app renders PDFs with a real headless Chromium (src/lib/reports/pdf.ts),
# which needs a long-running container rather than a stateless serverless function.
#
# No persistent disk. Documents, logos and report PDFs go to Cloudflare R2 through the S3-compatible
# backend (src/lib/storage/s3.ts) — the founder's provider decision of 2026-09-23. This blueprint
# used to mount a 1 GB disk for the local-disk backend; with R2 that disk would be provisioned,
# billed and never written to, and its presence would also rule out Render's zero-downtime deploys,
# which a service with an attached disk cannot do. The local-disk backend still exists and still
# works, but it is not what this file deploys. See docs/deployment.md "Object storage".
services:
  - type: web
    name: closecheck
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    preDeployCommand: npm run db:migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      # --- Object storage: Cloudflare R2, via the S3 API. All five are required; the app refuses
      # to serve in production on local disk unless STORAGE_ACKNOWLEDGE_LOCAL=true is set, because
      # without a mounted volume "local disk" here means the container's ephemeral filesystem and
      # every seller document would vanish on the next deploy. The bucket and endpoint are not
      # secrets but are still unsynced: they name the founder's Cloudflare account and belong with
      # the credentials that go with them. Region is "auto" for R2, always.
      # Token: named `closecheck-web-prod` in Cloudflare → R2 → Manage API Tokens, permission
      # "Object Read & Write", scoped to this one bucket. Named so it can be found and rotated.
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # Render terminates TLS and forwards one hop, so the client address is the last entry in
      # X-Forwarded-For. Stated rather than defaulted because getting it wrong in the permissive
      # direction lets a caller forge the address every rate limit is keyed on — both the API's and
      # sign-in's — and, worse, aim another user's budget at them. See src/lib/api/rateLimit.ts.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Superuser/owner connection Render provides for the database below — set this first from the
      # database's "Internal Connection String". Everything else here is bootstrapped FROM this one
      # per docs/deployment.md (rotate role passwords, then fill in DATABASE_URL and friends).
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_DATABASE_URL
        sync: false
      - key: SIGNUP_DATABASE_URL
        sync: false
      - key: PORTAL_DATABASE_URL
        sync: false
      - key: API_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Set once Render assigns the service's *.onrender.com URL (or a custom domain is attached).
      - key: NEXTAUTH_URL
        sync: false
      # --- Phase 2.5 revenue readiness (docs/roadmap.md Phase 2.5). All optional at deploy time:
      # with the Stripe/Resend keys unset the app runs in graceful fallback (no checkout surface,
      # emails recorded as LOGGED). Fill them in from the Stripe/Resend dashboards to go live; see
      # docs/deployment.md's billing/email sections. Kept as declared-but-unsynced so the service
      # knows the keys exist without them living in the blueprint.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SOLO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_TEAM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAM_ANNUAL
        sync: false
      - key: STRIPE_PRICE_AUDIT_OVERAGE
        sync: false
      # Enforcement ships dark (docs/releases.md §5 launch gate) — leave "false" until a real charge
      # and refund have round-tripped; setting it "true" starts blocking/ billing audit overages.
      - key: BILLING_ENFORCEMENT
        value: "false"

databases:
  - name: closecheck-db
    plan: basic-256mb
    postgresMajorVersion: "16"
