# Render Blueprint — see docs/deployment.md for the full first-deploy runbook (role password
# rotation, template seeding, and the other manual steps a blueprint can't automate).
#
# Render, not Vercel: this app renders PDFs with a real headless Chromium (src/lib/reports/pdf.ts)
# and stores uploaded evidence/logos on local disk (src/lib/storage/local.ts) — both need a
# long-running container with a persistent volume, not a stateless serverless function.
services:
  - type: web
    name: closecheck
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: closecheck-storage
      mountPath: /app/.local-storage
      sizeGB: 1
    preDeployCommand: npm run db:migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned to the disk's mountPath above rather than left to the default. They currently
      # coincide — the default is ./.local-storage and the mount is /app/.local-storage, with /app
      # as the workdir — which means uploaded evidence survives a deploy by luck rather than by
      # configuration. Change either one without the other and the app silently writes to the
      # container's ephemeral filesystem, discarding every seller document on the next deploy.
      # Setting it explicitly makes the two visibly one decision.
      - key: STORAGE_ROOT_DIR
        value: /app/.local-storage
      # Render terminates TLS and forwards one hop, so the client address is the last entry in
      # X-Forwarded-For. Stated rather than defaulted because getting it wrong in the permissive
      # direction lets a caller forge the address every rate limit is keyed on — both the API's and
      # sign-in's — and, worse, aim another user's budget at them. See src/lib/api/rateLimit.ts.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Superuser/owner connection Render provides for the database below — set this first from the
      # database's "Internal Connection String". Everything else here is bootstrapped FROM this one
      # per docs/deployment.md (rotate role passwords, then fill in DATABASE_URL and friends).
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_DATABASE_URL
        sync: false
      - key: SIGNUP_DATABASE_URL
        sync: false
      - key: PORTAL_DATABASE_URL
        sync: false
      - key: API_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Set once Render assigns the service's *.onrender.com URL (or a custom domain is attached).
      - key: NEXTAUTH_URL
        sync: false
      # --- Phase 2.5 revenue readiness (docs/roadmap.md Phase 2.5). All optional at deploy time:
      # with the Stripe/Resend keys unset the app runs in graceful fallback (no checkout surface,
      # emails recorded as LOGGED). Fill them in from the Stripe/Resend dashboards to go live; see
      # docs/deployment.md's billing/email sections. Kept as declared-but-unsynced so the service
      # knows the keys exist without them living in the blueprint.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SOLO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_TEAM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAM_ANNUAL
        sync: false
      - key: STRIPE_PRICE_AUDIT_OVERAGE
        sync: false
      # Enforcement ships dark (docs/releases.md §5 launch gate) — leave "false" until a real charge
      # and refund have round-tripped; setting it "true" starts blocking/ billing audit overages.
      - key: BILLING_ENFORCEMENT
        value: "false"

databases:
  - name: closecheck-db
    plan: basic-256mb
    postgresMajorVersion: "16"
