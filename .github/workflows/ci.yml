name: CI

# The suite is only worth what it is actually run against. There was none of this until
# 2026-09-22, while the test count grew past 290 across unit, integration and a browser journey —
# all of it only ever executed when someone remembered to.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref; nothing here is a deploy, so there is
  # no reason to finish a run whose result is already stale.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Fast feedback with no services: everything that can fail without a database should fail here,
  # in under a minute, rather than after Postgres and a browser have been provisioned.
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The Prisma client is generated code that nothing commits, and both tsc and the unit suite
      # import types from it.
      - run: npx prisma generate
      - run: npx eslint .
      # --incremental false: tsconfig.tsbuildinfo is committed, and a stale one would let a real
      # type error be skipped as already-checked.
      - run: npx tsc --noEmit --incremental false
      - run: npm test

  integration:
    name: Integration and browser journey
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: closecheck
          POSTGRES_PASSWORD: closecheck_dev
          POSTGRES_DB: closecheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The role passwords here are the hardcoded development ones the migrations create
      # (prisma/migrations/*_least_privilege_app_role and friends). They are not secrets and must
      # not be treated as such — production rotates them immediately via
      # scripts/rotate-production-role-passwords.ts, per docs/deployment.md step 6.
      DIRECT_DATABASE_URL: postgresql://closecheck:closecheck_dev@localhost:5432/closecheck?schema=public
      DATABASE_URL: postgresql://closecheck_app:closecheck_app_dev@localhost:5432/closecheck?schema=public
      AUTH_DATABASE_URL: postgresql://closecheck_auth:closecheck_auth_dev@localhost:5432/closecheck?schema=public
      SIGNUP_DATABASE_URL: postgresql://closecheck_signup:closecheck_signup_dev@localhost:5432/closecheck?schema=public
      PORTAL_DATABASE_URL: postgresql://closecheck_portal:closecheck_portal_dev@localhost:5432/closecheck?schema=public
      API_DATABASE_URL: postgresql://closecheck_api:closecheck_api_dev@localhost:5432/closecheck?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      CLOSECHECK_TEST_BASE_URL: http://localhost:3000
      # Nothing sits in front of the app here, so X-Forwarded-For is meaningless and every
      # unauthenticated caller resolves to the single shared "unknown" bucket — the readiness probe,
      # serverIsReachable(), and every deliberately-tokenless request the isolation suite makes.
      # At the production default of 120/minute those collectively exhaust one budget and the suite
      # starts seeing 429 where it asserts 401, failing the tenant-isolation gate for a reason that
      # has nothing to do with tenant isolation. The limiter's own behaviour is covered by unit
      # tests; here it must not become a source of false failures.
      TRUSTED_PROXY_HOPS: "0"
      API_RATE_LIMIT_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed templates
        # The integration fixtures need an active template with items; they fail loudly rather than
        # skipping if one is absent, so this is a hard prerequisite, not a convenience.
        run: npm run db:seed

      - name: Publish template versions
        # Every published version, in order, exactly as docs/deployment.md step 9 instructs — not
        # just the seed. Two reasons this is not redundant. It exercises the publish scripts and the
        # version-pinning rules on every push, which is the machinery that protects an in-flight
        # audit from having its findings change underneath it (spec.md §5) and which nothing else
        # here covers. And it makes CI's data match what a real deployment has, so a test cannot
        # pass against v1 template content while production runs v4.
        run: |
          npm run db:publish-tiera-expansion
          npm run db:publish-evidence-depth
          npm run db:publish-evidence-backed-thresholds

      - name: Verify row-level security
        run: npm run db:verify-rls
      - name: Verify signup and portal role privileges
        run: npm run db:verify-signup-portal-roles
      - name: Verify API role privileges
        run: npm run db:verify-api-role
      - name: Verify template version pinning
        run: npm run db:verify-template-versioning
      - name: Verify billing credit ledger
        run: npm run db:verify-billing-credits

      - name: Install Chromium
        # Needed by both the PDF pipeline and the browser journey. --with-deps pulls the system
        # libraries a headless Chromium needs on a bare runner.
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start the app
        # The integration suite drives a real server over HTTP — the §5 launch gate for the API
        # explicitly refuses to be satisfied by calling route handlers directly.
        #
        # Readiness sends a well-formed but bogus bearer token, NOT a tokenless request.
        #
        # A tokenless request returns 401 from authenticateApiRequest before apiPrisma is ever
        # touched, so it proves only that Next is listening — exactly as database-blind as the
        # "200 on /" it was supposed to improve on. A token with the right prefix forces the
        # api_keys lookup, so a 401 here means the app really can reach Postgres. If the database
        # were unreachable the probe would otherwise go green in a second and the integration
        # suite would fail later with a connection error that reads like a test bug.
        run: |
          npm start > app.log 2>&1 &
          probe_token="cc_live_$(printf 'A%.0s' $(seq 1 43))"
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $probe_token" \
              http://localhost:3000/api/v1/engagements || true)
            if [ "$code" = "401" ]; then
              echo "App ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App never became reachable; last status: ${code:-none}"
          cat app.log
          exit 1

      - name: Integration suite
        # The Stripe billing E2E is skipped here by EXPLICIT opt-out, not by the absence of a key.
        # It creates real test-mode objects against a real Stripe account, which has no business
        # happening on every push — but a suite that skips itself whenever a key is missing is a
        # suite that reports green having asserted nothing, and docs/releases.md §5 cites that file
        # as evidence for a closed launch gate. Opting out on purpose keeps the default loud.
        env:
          CLOSECHECK_SKIP_STRIPE_E2E: "true"
        run: npm run test:integration

      - name: Server log
        # A failing integration test shows the assertion but not what the server did to cause it.
        if: failure()
        run: tail -n 200 app.log || true
